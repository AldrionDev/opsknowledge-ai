[project]
name = "opsknowledge-ai"
version = "0.1.0"
description = "Enterprise RAG knowledge assistant for technical documentation, runbooks, incident reports, and operational knowledge."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # formatter may preserve long string literals

[tool.mypy]
python_version = "3.12"
files = ["app"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
